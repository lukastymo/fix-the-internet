name: Bug in article
description: Report something incorrect/outdated in an existing page
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: Link to the page or file path under docs/
      placeholder: "docs/how-to/x-disable-autoplay.md"
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What’s wrong?
      description: What’s incorrect/outdated/unclear?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Correct steps / expected behavior
    validations:
      required: false

  - type: input
    id: verified
    attributes:
      label: Verified on
      description: Date + platform/app version if you know it
      placeholder: "2026-01-06, Web"
    validations:
      required: false


