name: New article request
description: Request a new how-to/guide/reference/troubleshooting page
title: "[Article]: "
labels: ["article"]
body:
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - how-to
        - guide
        - reference
        - troubleshooting
    validations:
      required: true

  - type: input
    id: service
    attributes:
      label: Service / product
      placeholder: "X (Twitter), YouTube, Instagram, Firefox..."
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should the reader be able to do?
    validations:
      required: true

  - type: textarea
    id: platforms
    attributes:
      label: Platforms
      description: Web / iOS / Android / Desktop app / etc.
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes / links / screenshots
      description: Anything that helps verify or reproduce.
    validations:
      required: false


