site_name: Fix the Internet Wiki
site_description: Practical, step-by-step fixes for frustrating “hidden” settings and dark patterns.
repo_url: https://github.com/your-org-or-user/fix-the-internet
repo_name: fix-the-internet
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - content.tags
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      accent: indigo

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - toc:
      permalink: true

plugins:
  - search
  - tags:
      tags_file: tags.md

extra_javascript:
  - _assets/header-title-link.js
  - _assets/tags-headings-clickable.js

nav:
  - Home: index.md
  - Tags: tags.md
  - How-to:
      - X (Twitter): how-to/x-disable-autoplay.md
  - Templates:
      - How-to template: _templates/how-to.md


